[project]
name = "dsa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Boris Ciobirca", email = "boris.chobyrka@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
dsa = "dsa:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 5
addopts = "-q"